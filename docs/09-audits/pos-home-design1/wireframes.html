<style>

*{box-sizing:border-box}body{margin:0;background:#101115;color:var(--text)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #91bbff;outline-offset:3px}button[disabled]{opacity:.42;cursor:not-allowed}.toolbar{min-height:92px;background:#17191e;border-bottom:1px solid #343840;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:18px clamp(12px,3vw,48px);flex-wrap:wrap}.logo{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:790;letter-spacing:-.4px}.brandmark{width:38px;height:38px;background:var(--accent);border-radius:11px;display:grid;place-items:center;color:#fff}.tiny{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.075em;text-transform:uppercase}.controls{display:flex;flex-wrap:wrap;gap:13px;align-items:end}.control{display:flex;flex-direction:column;gap:5px}.control label{font-size:11px;color:#b4b8c1}.seg{display:flex;gap:3px;padding:4px;background:#0d0f14;border:1px solid #343841;border-radius:11px}.seg button{background:none;color:#aab1bf;padding:8px 13px;border:0;border-radius:8px;font-weight:650;font-size:12px}.seg button.selected{background:#343b49;color:white}.seg button.selected.orange{background:#b94f09}.stage{padding:22px 15px 60px;display:flex;align-items:flex-start;justify-content:center;min-height:calc(100vh - 93px);overflow:auto}.device{background:var(--bg);border:1px solid #42454f;box-shadow:0 20px 70px #0007;overflow:hidden}.device.phone{width:390px;height:822px;border-radius:25px;display:flex;flex-direction:column;flex:0 0 auto}.device.desktop{width:min(1280px,100%);height:796px;border-radius:15px;display:flex}.screen{display:flex;flex:1;overflow:hidden;min-height:0}.phone .side{display:none}.desktop .side{display:flex}.side{width:222px;background:#0b0d11;border-right:1px solid #272b32;padding:24px 12px;flex-direction:column;gap:6px}.side .logo{padding:3px 8px 24px;font-size:21px}.side .nav-item{display:flex;align-items:center;gap:10px;padding:13px 13px;color:#b3b9c6;font-size:13px;font-weight:650;border-radius:11px}.side .nav-item.active{background:#46250f;color:#ffb47e}.side .nav-item:nth-child(2){margin-top:7px}.side .group{font-size:10px;letter-spacing:.12em;color:#7a828f;padding:21px 12px 9px}.side-bottom{margin-top:auto;border-top:1px solid #252932;padding-top:18px;font-size:12px;color:#abb2bf;padding-left:12px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:62px;border-bottom:1px solid #272c35;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 28px;flex-shrink:0}.phone .head{height:67px;padding:0 17px}.head .brand{font-size:18px;font-weight:780;display:none;gap:9px;align-items:center}.phone .head .brand{display:flex}.head-right{display:flex;align-items:center;gap:10px}.connection{display:inline-flex;align-items:center;gap:6px;color:#b3bdca;font-size:12px;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good)}.connection.offline .dot{background:var(--warn)}.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid #373b46;background:#1b2027;color:#cbd0dd;font-size:12px;border-radius:100px;white-space:nowrap}.chip.green{color:#74e4b0;border-color:#244f3b;background:#10261b}.chip.orange{border-color:#6b411f;color:#ffc19a;background:#291a0f}.phone .head .chip{max-width:128px;overflow:hidden;text-overflow:ellipsis}.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icon.sm{width:16px;height:16px}.icon.lg{width:27px;height:27px}.content{overflow:auto;flex:1;padding:30px 32px 48px;min-height:0;scrollbar-color:#484d58 transparent}.phone .content{padding:23px 18px 24px}.phone .main{padding-bottom:0}.phone .only-desktop{display:none!important}.desktop .only-phone{display:none!important}.eyebrow{font-size:12px;color:#b6becd;font-weight:620}.welcome{display:flex;align-items:flex-start;justify-content:s id-template-columns:repeat(2,minmax(0,1fr));gap:9px}.phone .metrics .metric:nth-child(n+3){display:none}.metric{border:1px solid var(--line);border-radius:13px;padding:16px;background:var(--surface);min-width:0}.metric .caption{font-size:12px;color:#a3aab6;display:flex;gap:7px;align-items:center}.metric strong{font-size:23px;font-weight:780;display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric .extra{font-size:11px;color:#7bdfaf;margin-top:4px}.phone .metric{padding:13px}.phone .metric strong{font-size:21px}.metric .caption .icon{width:14px;height:14px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.phone .actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{padding:16px;background:#12151a;border:1px solid #343741;border-radius:13px;display:flex;gap:10px;align-items:center;min-height:86px}.action-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:#472510;color:#ff954f;flex-shrink:0}.action .alabel{font-size:13px;font-weight:690}.action .adesc{font-size:11px;color:#9fa8b8;margin-top:3px}.phone .action{flex-direction:column;align-items:flex-start;min-height:87px;padding:12px;gap:7px}.phone .action-icon{width:34px;height:34px}.phone .action .adesc{font-size:10px}.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:4px}.phone .columns{grid-template-columns:1fr}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px}.panel h4{font-size:13px;margin:0 0 12px}.attention{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #282d36;font-size:12px}.attention:first-of-type{border:0}.attention .icon{width:17px;height:17px;color:#ebaa66}.attention .grow{flex:1}.attention small{display:block;color:#9da5b4;margin-top:3px}.hint{background:#161f20;border:1px solid #2b4e43;border-radius:12px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px;font-size:12px;color:#b6 :10px}.phone .metrics{margin-top:5px}.phone .hint{font-size:11px}.footnote{text-align:center;color:#9ca3af;font-size:11px;margin-top:15px}.designflag{color:#f8a96a;font-weight:780;border:1px solid #925a30;background:#312012;padding:5px 9px;border-radius:8px;font-size:10px;letter-spacing:.06em}.phone .head .designflag{display:none}@media(max-width:700px){.stage{padding:14px 0 40px}.toolbar{padding:13px;gap:10px}.logo{font-size:17px}.controls{gap:9px}.control{max-width:100%}.seg button{padding:8px 9px}.device.desktop{min-width:740px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="toolbar"><div><div class="logo"><span class="brandmark" id="toolbar-logo"></span>SmartDuka <span class="designflag">DESIGN • NOT LIVE</span></div><div class="tiny" style="margin-top:5px">Role-adaptive POS home · review wireframes · sample values</div></div>
<div class="controls"><div class="control"><label id="role-label">Role</label><div class="seg" role="group" aria-labelledby="role-label"><button data-role="admin" class="selected orange" aria-pressed="true">Admin</button><button data-role="cashier" aria-pressed="false">Cashier</button></div></div><div class="control"><label id="view-label">Viewport</label><div class="seg" role="group" aria-labelledby="view-label"><button data-view="phone" class="selected" aria-pressed="true">Mobile</button><button data-view="desktop" aria-pressed="false">Desktop</button></div></div><div class="control"><label for="scenario">Scenario</label><select id="scenario" style="height:39px;background:#0c0e13;color:#f4f5f8;border:1px solid #343841;border-radius:9px;padding:0 9px;font-size:12px"></select></div></div></div>
<div class="stage"><div id="device" class="device phone" aria-label="SmartDuka dashboard wireframe"><div class="screen" id="screen"></div></div></div>
<div id="announce" aria-live="polite" class="sr-only" style="position:absolute;left:-9999px"></div>
<script>
const paths={cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2 13h13l2-9H6"/>',store:'<path d="M3 10l2-6h14l2 6-2 3H5z"/><path d="M5 13v8h14v-8M10 21v-6h4v6"/>',box:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="M3 7v10l9 5 9-5V7M12 12v10"/>',plus:'<path d="M12 5v14M5 12h14"/>',receipt:'<path d="M4 2h16v20l-4-2-4 2-4-2-4 2V2Z"/><path d="M8 7h8M8 11h8M8 15h4"/>',home:'<path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',stats:'<path d="M3 20V12M9 20V4M15 20v-9M21 20V7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 6a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>',scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 3"/>',check:'<path d="m5 12 5 5L20 7"/>',alert:'<path d="m12 2 10 18H2L12 2Z"/><path d="M12 9v4M12 17h.01"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a5 5 0 0 1 6 0M12 20h.01"/>',logout:'<path d="M10 3H4v18h6M14 7l5 5-5 5M8 12h11"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 5 12 7-12 7z"/>',coffee:'<path d="M3 7h15v7a7 7 0 0 1-14 0V7zM18 9h3v3h-3M2 21h18"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',refresh:'<path d="M20 7V3l-4 4h4A8 8 0 1 0 20 17"/>',tag:'<path d="M3 3h8l10 10-8 8L3 11V3Z"/><circle cx="8" cy="8" r="1"/>',lock:'<rect x="5" y="10" width="14" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const icon=(id,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[id]||paths.grid}</svg>`;
const state={role:'admin',view:'phone',scenario:'ready'};
const scenarios={admin:[['ready','Ready to sell'],['new','New shop / no products'],['error','Data temporarily unavailable']],cashier:[['active','Active shift'],['none','No active shift'],['break','On break']]};
const shopName='Load & Go';
const btn=(label,route,variant='secondary',extra='')=>`<button type="button" class="btn ${variant}" data-demo="${route}" ${extra}>${label}</button>`;
const action=(ico,label,desc,route)=>`<button class="action" data-demo="${route}" type="button" style="text-align:left;color:inherit"> <span class="action-icon">${icon(ico)}</span><span><span class="alabel">${label}</span><span class="adesc" style="display:block">${desc}</span></span></button>`;
const metric=(ico,label,value,extra='')=>`<div class="metric"><div class="caption">${icon(ico)}${label}</div><strong>${value}</strong>${extra?`<div class="extra">${extra}</div>`:''}</div>`;
const alert=(kind,title,txt)=>`<div class="hint ${kind}">${icon(kind==='error'?'alert':kind==='warn'?'alert':'info')}<span><strong>${title}</strong>${txt}</span></div>`;
function sidebar(){let cashier=state.role==='cashier'; const nav=cashier?[['home','Overview',true],['cart','Point of Sale'],['receipt','My receipts'],['clock','My shift']]:[['home','Dashboard',true],['cart','Point of Sale'],['box','Products'],['receipt','Orders'],['users','Cashiers'],['stats','Analytics'],['settings','Settings']];return `<aside class="side"><div class="logo"><span class="brandmark">${icon('cart')}</span>SmartDuka</div><div class="group">${cashier?'CASHIER WORKSPACE':'BUSINESS OPERATIONS'}</div>${nav.map(([ic,t,sel])=>`<div class="nav-item ${sel?'active':''}">${icon(ic,'sm')}${t}</div>`).join('')}<div class="side-bottom">${icon('info','sm')} Preview only · No live actions</div></aside>`}
function header(){let c=state.role==='cashier';return `<header class="head"><div class="brand"><span class="brandmark" style="width:29px;height:29px;border-radius:9px">${icon('cart','sm')}</span>SmartDuka</div><div class="only-desktop" style="font-size:12px;color:#b9bdc7">${c?'Cashier workspace':'Business command centre'} <span class="designflag" style="margin-left:10px">WIREFRAME</span></div><div class="head-right"><span class="connection"> <span class="dot"></span> Online </span><span class="chip">${icon('store','sm')}<span class="only-desktop">${shopName} · Main</span><span class="only-phone">Main</span></span><span class="only-desktop chip">${c?'Cashier':'Admin'}</span></div></header>`}
function tabbar(){return `<nav class="tabbar" aria-label="Preview mobile navigation"><span class="tab active">${icon('home')}Home</span><span class="tab pos"><span class="tab-icon">${icon('cart')}</span>POS</span><span class="tab">${icon('receipt')}Orders</span><span class="tab">${icon('menu')}More</span></nav>`}
function adminContent(){const fresh=state.scenario==='new',fail=state.scenario==='error';const summary=fresh?'Set up your first sale':fail?'Business overview':'Ready for today’s sales';const heroTitle=fresh?'Add your first product': 'Start a new sale';const heroDesc=fresh?'Your catalogue is empty. Add a product, then you can start selling.':'Scan products, create a cart and complete checkout in a few taps.';const heroAction=fresh?btn(`${icon('plus')} Add first product ${icon('arrow')}`,'/admin/products','primary'):btn(`${icon('cart')} Open POS ${icon('arrow')}`,'/pos','primary');const hero=`<div class="hero"><div><div class="toplabel">${fresh?'GETTING STARTED':'ONE-TAP SELLING'}</div><h2>${heroTitle}</h2><p>${heroDesc}</p>${heroAction}</div><div class="hero-art">${icon(fresh?'box':'cart')}</div></div>`;const metrics=`<div class="metrics">${metric('stats','Sales today',fail?'—':fresh?'KSh 0':'KSh 18,450',fail?'Unavailable':fresh?'No sales yet':'Updated just now')}${metric('receipt','Orders',fail?'—':fresh?'0':'32')}${metric('box','Products',fail?'—':fresh?'0':'128')}${metric('stats','Revenue',fail?'—':fresh?'KSh 0':'KSh 384,250')}</div>`;const readyAlert=fresh?alert('','Start with your catalogue','Add a product and set its price. You can manage categories later.'):fail?alert('error','Sales figures unavailable','Your data has not been replaced with zeros. Try refreshing the affected section.'):alert('warn','M-Pesa is temporarily unavailable','Other verified checkout methods remain available.'); const top=`<div class="welcome"><div><div class="eyebrow">${shopName} · Main shop</div><h1>Good evening, Admin</h1><div class="subline">${summary}</div></div><span class="chip green only-desktop">${icon('check','sm')} Shop active</span></div>`;const actions=`<div class="section-label"><h3>Quick actions</h3><a href="#" data-demo="customize" class="only-desktop">Customize later</a></div><div class="actions">${action('plus',fresh?'Add product':'Products',fresh?'First item':'Inventory','/admin/products')}${action('receipt','Orders','Find a receipt','/orders')}${action('users','Cashiers','Team & shifts','/admin/cashiers')}${action('stats','Reports','Sales insights','/admin/analytics/sales')}</div>`;const status=`<div class="panel"><h4>Operations to watch</h4><div class="attention">${icon('box')}<div class="grow"><b>${fresh?'No products added':'Low stock'}</b><small>${fresh?'Set up products before your first checkout':'3 items need attention'}</small></div>${icon('arrow','sm')}</div><div class="attention">${icon('wifi')}<div class="grow"><b>Sync status</b><small>Online · No pending uploads</small></div>${icon('check','sm')}</div><div class="attention">${icon('alert')}<div class="grow"><b>Payment availability</b><small>M-Pesa initiation paused</small></div>${icon('arrow','sm')}</div></div>`;const recent=`<div class="panel"><h4>Recent orders</h4>${fresh?'<div class="muted small" style="padding:18px 2px">Sales will appear here after checkout.</div>':`<div class="order"><span>Order #SD-1042<small>Cash · 6:42 PM</small></span><strong>KSh 1,250</strong></div><div class="order"><span>Order #SD-1041<small>Cash · 5:58 PM</small></span><strong>KSh 3,800</strong></div><div class="order"><span>Order #SD-1040<small>Card · 4:12 PM</small></span><strong>KSh 850</strong></div>`}<div style="margin-top:10px">${btn('View orders '+icon('arrow'),'/orders','secondary')}</div></div>`;return `<div class="content">${top}<div class="top-row"><div>${hero}<div class="only-desktop">${readyAlert}</div></div><div class="only-desktop">${status}</div></div><div class="section-label"><h3>Business today</h3><span class="small muted">${fail?'Refresh needed':'Local business time'}</span></div>${metrics}${actions}<div class="only-phone">${readyAlert}</div><div class="section-label"><h3>At a glance</h3></div><div class="columns"><div class="only-phone">${status}</div>${recent}</div><div class="footnote">Illustrative data · Design only · No transactions</div></div>`}
function cashierContent(){let none=state.scenario==='none',isBreak=state.scenario==='break',active=!none;const status=none?'Shift not started':isBreak?'On break':'Shift running';const heroTitle=none?'Start your shift':isBreak?'Resume your shift':'New sale';const heroDesc=none?'Open your till and confirm the opening cash before selling.':isBreak?'End your break to continue checkout.':'Scan a barcode or search for a product to start the next sale.';const route=none?'demo:shift':isBreak?'demo:resume':'/pos';const hero=`<div class="hero"><div><div class="toplabel">${none?'BEFORE YOU SELL':isBreak?'SHIFT ON HOLD':'READY FOR CHECKOUT'}</div><h2>${heroTitle}</h2><p>${heroDesc}</p>${btn(`${icon(none?'play':isBreak?'play':'cart')} ${none?'Start shift':isBreak?'End break':'Open POS'} ${icon('arrow')}`,route,'primary')}</div><div class="hero-art">${icon(none?'clock':isBreak?'coffee':'scan')}</div></div>`;const shifts=`<div class="status-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h4>My shift</h4><span class="chip ${none?'orange':'green'}">${icon(none?'clock':'check','sm')}${status}</span></div><div class="statrow"><span>Shift started</span><b>${none?'Not yet':'9:00 AM'}</b></div><div class="statrow"><span>Branch</span><b>Main shop</b></div><div class="statrow"><span>Opening float</span><b>${none?'—':'KSh 2,000'}</b></div>${none?'':`<div class="statrow"><span>Transactions</span><b>18</b></div>`}<div class="foot">${none?'Start shift to track sales and cash reconciliation.':isBreak?'Checkout is unavailable until break ends.':'Your shift is active. End-of-day reconciliation is available in Shift details.'}</div></div>`;const metrics=`<div class="metrics">${metric('stats','My shift sales',none?'—':'KSh 8,400')}${metric('receipt','Transactions',none?'—':'18')}${metric('clock','Time on shift',none?'—':'5h 20m')}${metric('store','Branch','Main')}</div>`;const actions=`<div class="section-label"><h3>Fast actions</h3></div><div class="actions">${action('scan','Scan item','Open scanner','/pos')}${action('receipt','My receipts','Recent sales','/cashier/dashboard')}${action('clock','Shift details','Time & cash','/cashier/dashboard')}${action(isBreak?'play':'coffee',isBreak?'End break':'Take break',isBreak?'Resume selling':'Shift pause','demo:break')}</div>`;const panel=`<div class="panel"><h4>My recent sales</h4>${none?'<div class="muted small" style="padding:15px 0">Your shift sales will show here once you begin working.</div>':`<div class="order"><span>Receipt #1042<small>6:42 PM · Cash</small></span><strong>KSh 1,250</strong></div><div class="order"><span>Receipt #1041<small>5:58 PM · Cash</small></span><strong>KSh 3,800</strong></div>`}</div>`;return `<div class="content"><div class="welcome"><div><div class="eyebrow">${shopName} · Main shop</div><h1>Welcome, Cashier</h1><div class="subline">${status} · Your sales workspace</div></div><span class="chip green only-desktop">${icon('check','sm')} Cashier access</span></div><div class="top-row"><div>${hero}</div><div class="only-desktop">${shifts}</div></div><div class="section-label"><h3>My activity</h3><span class="small muted">Current shift</span></div>${metrics}${actions}<div class="only-phone">${none?alert('','Your next step','Starting a shift is required before selling.'):isBreak?alert('warn','Checkout paused','You can view your shift while on break.'):alert('','Shift active','You’re ready to sell. Only your authorized shift information is shown.')}</div><div class="section-label"><h3>Shift overview</h3></div><div class="columns"><div class="only-phone">${shifts}</div>${panel}</div><div class="footnote">Illustrative data · Design only · No transactions</div></div>`}
function render(){const sel=document.querySelector('#scenario');const old=sel.value;sel.innerHTML=scenarios[state.role].map(([value,label])=>`<option value="${value}">${label}</option>`).join(''); if(scenarios[state.role].some(([k])=>k===state.scenario))sel.value=state.scenario;else{state.scenario=scenarios[state.role][0][0];sel.value=state.scenario};let device=document.getElementById('device');device.className='device '+(state.view==='phone'?'phone':'desktop');document.querySelector('#screen').innerHTML=sidebar()+`<div class="main">${header()}${state.role==='admin'?adminContent():cashierContent()}${tabbar()}</div>`;document.querySelectorAll('[data-role]').forEach(el=>{let yes=el.dataset.role===state.role;el.classList.toggle('selected',yes);el.classList.toggle('orange',yes);el.setAttribute('aria-pressed',yes)});document.querySelectorAll('[data-view]').forEach(el=>{let yes=el.dataset.view===state.view;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',yes)});document.getElementById('announce').textContent=`${state.role} ${state.view}, ${sel.selectedOptions[0].textContent} wireframe`}
document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',()=>{state.role=el.dataset.role;state.scenario=state.role==='admin'?'ready':'active';render()}));document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{state.view=el.dataset.view;render()}));document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;render()});document.addEventListener('click',e=>{let a=e.target.closest('[data-demo]');if(!a)return;e.preventDefault();if(a.dataset.demo==='demo:shift'){state.scenario='active';render()}else if(a.dataset.demo==='demo:resume'){state.scenario='active';render()}else if(a.dataset.demo==='demo:break'){state.scenario=state.scenario==='break'?'active':'break';render()}else{document.getElementById('announce').textContent=`Design preview only: ${a.dataset.demo}. No app navigation.`;let label=a.textContent.trim();a.title=`Preview only: ${label}`;a.style.boxShadow='0 0 0 2px #ffa260';setTimeout(()=>{if(a.isConnected)a.style.boxShadow=''},650)}});document.getElementById('toolbar-logo').innerHTML=icon('cart');render();
</script></body></html>
